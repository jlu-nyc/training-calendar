<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#0f0f23"/>
  <!-- Runner figure -->
  <!-- Head -->
  <circle cx="20" cy="7" r="2.5" fill="#7986cb"/>
  <!-- Body -->
  <line x1="20" y1="9.5" x2="18" y2="16" stroke="#7986cb" stroke-width="2" stroke-linecap="round"/>
  <!-- Left arm (forward) -->
  <line x1="19" y1="12" x2="13" y2="11" stroke="#7986cb" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right arm (back) -->
  <line x1="19" y1="12" x2="23" y2="14" stroke="#7986cb" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Left leg (forward/down) -->
  <line x1="18" y1="16" x2="13" y2="21" stroke="#7986cb" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="13" y1="21" x2="11" y2="25" stroke="#7986cb" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right leg (back/up) -->
  <line x1="18" y1="16" x2="22" y2="19" stroke="#5c6bc0" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="22" y1="19" x2="25" y2="16" stroke="#5c6bc0" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Ground line -->
  <line x1="6" y1="26" x2="26" y2="26" stroke="#1e1e3a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
