<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD84D"/>
      <stop offset="50%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#FF4D7A"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background; iOS/Android apply their own icon masks -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Runner, mid-stride: forward-leaning torso, wide scissor stance
       (front leg reaching down, back leg trailing down), arms swinging
       opposite the legs. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="292" cy="123" r="36" fill="#FFFFFF"/>
    <!-- Torso -->
    <line x1="270" y1="166" x2="241" y2="253" stroke="#FFFFFF" stroke-width="36"/>
    <!-- Front arm, swung forward -->
    <path d="M270,166 L300,190 L340,175" stroke="#FFFFFF" stroke-width="29"/>
    <!-- Back arm, swung back -->
    <path d="M270,166 L227,195 L191,174" stroke="#1A1A2E" stroke-width="29"/>
    <!-- Front leg, reaching down toward the ground -->
    <path d="M241,253 L292,289 L321,390" stroke="#FFFFFF" stroke-width="29"/>
    <!-- Back leg, trailing down and back -->
    <path d="M241,253 L191,303 L162,390" stroke="#1A1A2E" stroke-width="29"/>
  </g>
</svg>
